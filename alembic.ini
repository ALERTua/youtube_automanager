# The Alembic command line for the service database. Run it from the repository root, for example:
#   uv run alembic -x url=sqlite:///path/to/youtube_automanager.sqlite upgrade head
# Without "-x url=...", the URL is database_url from the settings of the service. Its default is sqlite:///<db_filepath>.
# The service itself upgrades its database at start and does not read this file.

[alembic]
script_location = %(here)s/youtube_automanager/db/migrations
prepend_sys_path = %(here)s
path_separator = os

[post_write_hooks]
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
