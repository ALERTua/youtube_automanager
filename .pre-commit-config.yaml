# These hooks need the project environment of uv, which the pre-commit.ci runners do not have.
ci:
  skip: [uv-lock, ty]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-docstring-first
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      # Run the linter.
      - id: ruff
        args: [ --fix ]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock

  # The type checker. The rev gives the same ty version as uv.lock, and --locked keeps the lock file as it is.
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.91
    hooks:
      - id: ty
        args: [--locked]

  - repo: https://github.com/immanuwell/dockerfile-roast
    rev: 1.7.0
    hooks:
      - id: droast

  # Workflow linter: syntax, expressions, action inputs and shell scripts of the workflows
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Workflow security audit: https://docs.zizmor.sh
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.31.1
    hooks:
      - id: zizmor
        args: [--offline, --config=.github/zizmor.yml]
