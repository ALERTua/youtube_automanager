name: Docker Image

on:
  workflow_dispatch:
    inputs:
      alert-server:
        description: Build on buildkit of alert-server when it answers. Off builds on GitHub.
        type: boolean
        default: true
      push:
        description: Push the image of a run on a branch other than main, with the branch name as the tag.
        type: boolean
        default: false

  push:
    branches:
      - "main"
    tags:
      - "*"
    paths-ignore:
      - ".pre-commit-config.yaml"
      - ".github/dependabot.yml"

  # a pull request builds the image without a push
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - ".pre-commit-config.yaml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # actionlint 1.7.12 refuses the self-repository form "$/..." that zizmor suggests.
    uses: ./.github/workflows/tests.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read # checkout

  # The smoke test starts the image and waits until Docker reports it healthy. The shared build workflow has no such
  # step, and it pushes no image on a pull request, so this job builds the image itself on the GitHub runner.
  # It runs next to the build, so a slow smoke test does not delay the push.
  smoke:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -t smoke .

      # The service needs a key for the cookies. The image makes a throwaway key for this run.
      - name: Start the container
        run: |
          key="$(docker run --rm smoke python -c 'from youtube_automanager.youtube.session import generate_key; print(generate_key())')"
          docker run -d --name smoke -e "COOKIES_KEY=$key" -p 8080:8080 smoke

      # The health check of the image runs every 30 s, so the first healthy state comes after about 30 s.
      - name: Wait until Docker reports the container healthy
        run: |
          for _ in $(seq 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' smoke)"
            echo "The health status is $status"
            if [ "$status" = healthy ]; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::The container is not healthy after 90 s"
          exit 1

      # The web UI answers the root page with 200, and it refuses a foreign host name with 400.
      - name: Check the answers of the service
        run: |
          curl -fsS http://localhost:8080/health
          echo
          code="$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8080/)"
          echo "The root page gives $code"
          if [ "$code" != 200 ]; then
            echo "::error::The root page gives $code, not 200"
            exit 1
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: evil.example.com' http://localhost:8080/)"
          echo "The root page with a foreign host name gives $code"
          if [ "$code" != 400 ]; then
            echo "::error::A foreign host name gives $code, not 400"
            exit 1
          fi

      - name: Show the log of the container
        if: failure()
        run: docker logs smoke

      - name: Remove the container
        if: always()
        run: docker rm -f smoke

  build-and-publish:
    needs: tests
    # builds on buildkit of alert-server when it answers through the tailnet, otherwise on GitHub
    uses: ALERTua/ci-workflows/.github/workflows/docker-build.yml@v4.1.0
    permissions:
      contents: read # checkout
      packages: write # push of the image to ghcr.io
      id-token: write # Tailscale accepts the GitHub OIDC token instead of a key
    with:
      alert-server: ${{ github.event_name != 'workflow_dispatch' || inputs.alert-server }}
      push: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}
