name: Docker Image

on:
  workflow_dispatch:
    inputs:
      alert-server:
        description: Build on buildkit of alert-server when it answers. Off builds on GitHub.
        type: boolean
        default: true
      push:
        description: Push the image of a run on a branch other than main, with the branch name as the tag.
        type: boolean
        default: false

  push:
    branches:
      - "main"
    tags:
      - "*"
    paths-ignore:
      - ".pre-commit-config.yaml"
      - "userscript/**"
      - "script/**"
      - "docs/**"
      - ".github/dependabot.yml"

  # a pull request builds the image without a push
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - ".pre-commit-config.yaml"
      - "userscript/**"
      - "script/**"
      - "docs/**"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    # builds on buildkit of alert-server when it answers through the tailnet, otherwise on GitHub
    uses: ALERTua/ci-workflows/.github/workflows/docker-build.yml@v4.0.0
    permissions:
      contents: read # checkout
      packages: write # push of the image to ghcr.io
      id-token: write # Tailscale accepts the GitHub OIDC token instead of a key
    with:
      alert-server: ${{ github.event_name != 'workflow_dispatch' || inputs.alert-server }}
      push: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}

  report:
    needs: build-and-publish
    if: always()
    uses: ALERTua/ci-workflows/.github/workflows/pr-report.yml@v4.0.0
    permissions:
      pull-requests: write # comment of the build results on the open pull request of the branch
