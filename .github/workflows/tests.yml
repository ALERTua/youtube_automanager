name: Tests

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:
  # The image workflow calls this workflow before it builds the image.
  workflow_call:

permissions: {}

# In a called workflow, github.workflow is the name of the caller, so the group needs a name of its own.
# With the group of the caller, GitHub sees a deadlock and cancels the run.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout
    services:
      # The tests of the database, the migrations and the engine also run on PostgreSQL. Each worker of the parallel
      # run creates a template database of its own there, and each test gets a copy of it.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # --locked fails when uv.lock does not agree with pyproject.toml.
      - name: Install the dependencies
        run: uv sync --locked --all-groups

      # The coverage report names each line of the service that no test runs. The limit lives in the recipe
      # "just cov", because a limit in CI would stop a pull request for a line of a tool.
      - name: Run the tests
        run: uv run pytest -q -n auto --cov=youtube_automanager --cov-report=term-missing:skip-covered
