name: Tests

on:
  push:
    branches:
      - "main"
      - "v1"
  pull_request:
    branches:
      - "main"
      - "v1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout
    services:
      # The migration tests also run on PostgreSQL. Each worker of the parallel run creates a database of its own there.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # --locked fails when uv.lock does not agree with pyproject.toml.
      - name: Install the dependencies
        run: uv sync --locked --all-groups

      - name: Run the tests
        run: uv run pytest -q -n auto
