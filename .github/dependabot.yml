version: 2
updates:
  # the actions of the workflows, pinned by their commit SHA
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "weekly"
    # a release must be a week old first, so a broken or hostile release can be withdrawn
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
