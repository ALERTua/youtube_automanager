version: 2
updates:
  # the actions of the workflows, pinned by their commit SHA
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: "weekly"
