[project]
name = "youtube-automanager"
version = "0.1.2"
description = "Adds videos to your YouTube playlists automatically based on rules"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "alembic",
    "apprise",
    "apscheduler",
    "cryptography",
    "datalogic-py",
    "fastapi",
    "nicegui",
    "packaging",
    "psycopg[binary]",
    "pydantic-settings",
    "sqlalchemy",
    "tzdata",
    "uvicorn",
    "yt-dlp",
]

[dependency-groups]
dev = [
    "babel",
    "httpx",
    "pre-commit-uv",
    "pytest",
    "pytest-xdist",
    "ruff",
]

[tool.uv]
exclude-newer = "1 week"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# The message catalog template of the user interface. After a change of a translated text, run this command in the
# repository root:
# uv run pybabel extract -F pyproject.toml --add-location=file --sort-output --add-comments=Translators: -o youtube_automanager/i18n/messages.pot youtube_automanager
[[tool.babel.mappings]]
method = "python"
pattern = "**.py"
