[project]
name = "youtube-automanager"
version = "0.1.2"
description = "Adds videos to your YouTube playlists automatically based on rules"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "apprise",
    "fastapi",
    "packaging",
    "pendulum",
    "pydantic-settings",
    "pyyaml",
    "sqlalchemy",
    "uvicorn",
    "yt-dlp",
]

[dependency-groups]
dev = [
    "pre-commit-uv",
    "pytest",
    "ruff",
]

[tool.uv]
exclude-newer = "1 week"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
