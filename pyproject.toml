[project]
name = "youtube-automanager"
version = "0.1.1"
description = "Adds videos to your YouTube playlists automatically based on rules"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.121.1",
    "global-logger>=0.4.7",
    "google-api-python-client>=2.187.0",
    "google-auth-oauthlib>=1.2.3",
    "knockknock>=0.1.8.1",
    "oauth2client>=4.1.3",
    "pendulum>=3.1.0",
    "python-worker>=2.2.4",
    "python-youtube>=0.9.8",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.44",
    "trustme>=1.2.1",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.4.0",
    "ruff>=0.14.4",
]
