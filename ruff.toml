line-length = 120
indent-width = 4

exclude = [
    ".git",
    ".ruff_cache",
    ".tox",
    ".venv*",
    ".vscode",
    "__pypackages__",
    "_build",
    "build",
    "dist",
    "tryouts*.py",
]

# [lint] keeps the default rule set of ruff. "uv run ruff check --show-settings" lists it.

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"
